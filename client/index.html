<!doctype html>
<html lang="en" class="intro-running intro-hold">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0E3C46" />
    <meta property="og:title" content="TG-Homes" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="TG-Homes: holiday homes in Kenya, booked directly with the owner." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>TG-Homes</title>
    <!-- The loading screen: shown at once, then opened by src/components/ui/SiteIntro.jsx. -->
    <style>
      html.intro-running { overflow: hidden; }
      html.intro-running [data-site-logo] { opacity: 0; }
      html.intro-hold #root * { animation-play-state: paused !important; }
      #site-intro { position: fixed; inset: 0; z-index: 100; animation: intro-failsafe 0s linear 12s forwards; }
      #site-intro.is-open { pointer-events: none; }
      .intro-panel { position: absolute; left: 0; right: 0; height: 50.5%; background: rgb(42 39 37); transition: transform 1.1s cubic-bezier(0.76, 0, 0.24, 1); }
      .intro-panel.top { top: 0; }
      .intro-panel.bottom { bottom: 0; }
      #site-intro.is-open .intro-panel.top { transform: translateY(-100%); }
      #site-intro.is-open .intro-panel.bottom { transform: translateY(100%); }
      .intro-logo { position: absolute; left: 50%; top: 50%; width: min(64vw, 340px); transform: translate(-50%, -50%); transform-origin: 0 0; }
      .intro-logo img { display: block; width: 100%; height: auto; transition: opacity 0.9s ease; }
      .intro-logo img.target { position: absolute; inset: 0; opacity: 0; }
      .intro-logo img.white { animation: intro-in 0.8s ease-out both; }
      .intro-bar { position: absolute; left: 25%; right: 25%; top: calc(100% + 28px); height: 2px; overflow: hidden; border-radius: 2px; background: rgb(255 255 255 / 0.15); transition: opacity 0.3s ease; }
      .intro-bar::after { content: ''; position: absolute; inset: 0; width: 40%; background: rgb(255 255 255 / 0.85); animation: intro-bar 1.1s ease-in-out infinite; }
      #site-intro.is-open .intro-bar { opacity: 0; }
      @keyframes intro-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
      @keyframes intro-bar { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @keyframes intro-failsafe { to { visibility: hidden; } }
    </style>
  </head>
  <body>
    <div id="site-intro" aria-hidden="true">
      <div class="intro-panel top"></div>
      <div class="intro-panel bottom"></div>
      <div class="intro-logo">
        <img class="white" src="/brand/tg-homes-horizontal-white.svg" alt="" width="2687" height="600" />
        <img class="target" alt="" width="2687" height="600" />
        <div class="intro-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
